<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Курсы валют и золото — YuNur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&display=swap&subset=cyrillic" rel="stylesheet">
    <style>
        /* ==================== НАСТРОЙКИ ==================== */
        :root {
            --header-bg: #1b4332;
            --accent-color: #2d6a4f;
            --bg-color: #f2f7f4;
            --text-color: #1b4332;
            --card-bg: #ffffff;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            font-size: 16px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ==================== ШАПКА ==================== */
        header {
            background-color: var(--header-bg);
            color: var(--white);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo img {
            height: 45px;
            border-radius: 8px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            color: var(--white);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s;
        }

        nav a:hover {
            opacity: 0.8;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--white);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .header-btn {
            background: var(--white);
            color: var(--header-bg);
            padding: 10px 24px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: opacity 0.3s;
        }

        .header-btn:hover {
            opacity: 0.9;
        }

        /* ==================== СЕКЦИИ ==================== */
        section {
            padding: 60px 0;
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 3rem;
            color: var(--header-bg);
        }

        /* ==================== КУРСЫ ВАЛЮТ ==================== */
        .rates-section {
            background-color: var(--bg-color);
        }

        .rates-card {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--accent-color);
            border-radius: 30px;
            padding: 2rem;
        }

        .rates-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
        }

        .rates-table th,
        .rates-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .rates-table th {
            color: var(--header-bg);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .rates-table td {
            font-size: 1rem;
        }

        .rates-table tr:last-child td {
            border-bottom: none;
        }

        .rate-change {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .rate-change.positive {
            color: #2d6a4f;
        }

        .rate-change.negative {
            color: #d32f2f;
        }

        .rate-change.neutral {
            color: #666;
        }

        .rates-update-time {
            font-size: 0.85rem;
            color: #666;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .rates-btn-container {
            text-align: center;
        }

        .btn-rates {
            background-color: var(--accent-color);
            color: var(--white);
            padding: 12px 30px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.3s;
            font-family: inherit;
        }

        .btn-rates:hover {
            opacity: 0.9;
        }

        .rates-error {
            text-align: center;
            color: #666;
            padding: 2rem;
            font-size: 1.1rem;
        }

        .rates-pending {
            text-align: center;
            color: var(--header-bg);
            padding: 2rem;
            font-size: 1.1rem;
        }

        /* ==================== ПОДВАЛ ==================== */
        footer {
            background-color: var(--header-bg);
            color: var(--white);
            text-align: center;
            padding: 2rem 0;
        }

        /* ==================== МОБИЛЬНАЯ ВЕРСИЯ ==================== */
        @media (max-width: 768px) {
            .mobile-menu-btn {
                display: block;
            }

            .header-btn {
                display: none;
            }

            nav ul {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background-color: var(--header-bg);
                flex-direction: column;
                padding: 1rem 0;
                gap: 0;
            }

            nav ul.active {
                display: flex;
            }

            nav ul li {
                text-align: center;
                padding: 0.75rem 0;
            }

            nav ul li a {
                display: block;
                padding: 0.5rem 1rem;
            }

            .section-title {
                font-size: 1.8rem;
            }

            .rates-table th,
            .rates-table td {
                padding: 0.75rem 0.5rem;
                font-size: 0.9rem;
            }

            .rates-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Шапка -->
    <header>
        <div class="container header-content">
            <a href="index.html" class="logo"><img src="logo.png" alt="YuNur"></a>
            <button class="mobile-menu-btn" onclick="toggleMenu()">☰</button>
            <nav>
                <ul id="nav-menu">
                    <li><a href="index.html#calculator">Калькулятор</a></li>
                    <li><a href="index.html#how-it-works">Как это работает</a></li>
                    <li><a href="index.html#about">О компании</a></li>
                    <li><a href="rates.html">Курсы валют</a></li>
                    <li><a href="index.html#application">Заявка</a></li>
                </ul>
            </nav>
            <a href="index.html#application" class="header-btn">Оставить заявку</a>
        </div>
    </header>

    <!-- Курсы валют и золото -->
    <section class="rates-section">
        <div class="container">
            <h2 class="section-title">Курсы валют и золото</h2>
            <div class="rates-card">
                <div id="rates-content">
                    <table class="rates-table">
                        <thead>
                            <tr>
                                <th>Валюта / Актив</th>
                                <th>Курс (₽)</th>
                                <th>Изменение</th>
                            </tr>
                        </thead>
                        <tbody id="rates-body">
                            <tr>
                                <td colspan="3" style="text-align: center;">Загрузка данных...</td>
                            </tr>
                        </tbody>
                    </table>
                    <div id="rates-update-time" class="rates-update-time"></div>
                    <div id="rates-pending" class="rates-pending" style="display: none;">Курсы скоро обновятся</div>
                    <div id="rates-error" class="rates-error" style="display: none;"></div>
                    <div class="rates-btn-container">
                        <button class="btn-rates" onclick="loadRates()">Обновить курсы</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Подвал -->
    <footer>
        <div class="container">
            <p>&copy; YuNur. Исламская рассрочка без переплат.</p>
        </div>
    </footer>

    <script>
        // Мобильное меню
        function toggleMenu() {
            const menu = document.getElementById('nav-menu');
            menu.classList.toggle('active');
        }

        // Загрузка курсов из локального JSON файла
        async function loadRates() {
            const ratesBody = document.getElementById('rates-body');
            const updateTimeEl = document.getElementById('rates-update-time');
            const errorEl = document.getElementById('rates-error');
            const pendingEl = document.getElementById('rates-pending');

            try {
                // Добавляем timestamp чтобы избежать кэширования
                const response = await fetch('data/rates.json?t=' + Date.now());
                
                if (!response.ok) {
                    throw new Error('Файл не найден');
                }

                const data = await response.json();

                if (!data.currencies || data.currencies.length === 0) {
                    throw new Error('Нет данных');
                }

                let html = '';
                data.currencies.forEach(curr => {
                    let changeHtml = '<span class="rate-change neutral">—</span>';

                    if (curr.previous !== null && curr.previous > 0) {
                        const change = curr.value - curr.previous;
                        const changePercent = ((change / curr.previous) * 100).toFixed(2);

                        if (change > 0) {
                            changeHtml = `<span class="rate-change positive">+${change.toFixed(2)} (+${changePercent}%)</span>`;
                        } else if (change < 0) {
                            changeHtml = `<span class="rate-change negative">${change.toFixed(2)} (${changePercent}%)</span>`;
                        } else {
                            changeHtml = '<span class="rate-change neutral">0.00 (0.00%)</span>';
                        }
                    }

                    html += `
                        <tr>
                            <td>${curr.name} (${curr.code})</td>
                            <td>${curr.value.toFixed(2)}</td>
                            <td>${changeHtml}</td>
                        </tr>
                    `;
                });

                ratesBody.innerHTML = html;

                // Форматируем дату обновления
                if (data.updatedAt) {
                    const updateDate = new Date(data.updatedAt);
                    const formattedDate = updateDate.toLocaleString('ru-RU', {
                        day: 'numeric',
                        month: 'long',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    updateTimeEl.textContent = `Обновлено: ${formattedDate}`;
                }

                errorEl.style.display = 'none';
                pendingEl.style.display = 'none';

            } catch (error) {
                console.error('Ошибка загрузки курсов:', error);
                ratesBody.innerHTML = '';
                updateTimeEl.textContent = '';
                errorEl.textContent = '';
                pendingEl.style.display = 'block';
            }
        }

        // Загружаем курсы при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            loadRates();
        });
    </script>
</body>
</html>
