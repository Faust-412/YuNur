<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Курсы валют и золото — YuNur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&display=swap&subset=cyrillic" rel="stylesheet">
    <style>
        /* ==================== НАСТРОЙКИ ==================== */
        :root {
            --header-bg: #1b4332;
            --accent-color: #2d6a4f;
            --bg-color: #f2f7f4;
            --text-color: #1b4332;
            --card-bg: #ffffff;
            --white: #ffffff;
            --green-up: #2d6a4f;
            --red-down: #d32f2f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            font-size: 16px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ==================== ШАПКА ==================== */
        header {
            background-color: var(--header-bg);
            color: var(--white);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo img {
            height: 45px;
            border-radius: 8px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            color: var(--white);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s;
        }

        nav a:hover {
            opacity: 0.8;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--white);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .header-btn {
            background: var(--white);
            color: var(--header-bg);
            padding: 10px 24px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: opacity 0.3s;
        }

        .header-btn:hover {
            opacity: 0.9;
        }

        /* ==================== КАТАЛОГ DROPDOWN ==================== */
        .catalog-btn {
            background: transparent;
            color: var(--white);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            margin-right: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .catalog-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .catalog-btn-icon {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .catalog-btn-icon span {
            display: block;
            width: 18px;
            height: 2px;
            background: var(--white);
            border-radius: 1px;
        }

        .catalog-dropdown {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: var(--white);
            border: 1px solid var(--accent-color);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(27, 67, 50, 0.2);
            z-index: 999;
            display: none;
            overflow: hidden;
            max-width: 900px;
            width: calc(100vw - 40px);
        }

        .catalog-dropdown.active {
            display: block;
            animation: dropdownFade 0.2s ease forwards;
        }

        @keyframes dropdownFade {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .catalog-dropdown-content {
            display: flex;
            padding: 1.5rem;
            gap: 1.5rem;
        }

        .catalog-categories {
            min-width: 220px;
            border-right: 1px solid rgba(27, 67, 50, 0.1);
            padding-right: 1.5rem;
        }

        .catalog-category {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }

        .catalog-category:hover {
            background: var(--bg-color);
        }

        .catalog-category.active {
            background: var(--accent-color);
            color: var(--white);
        }

        .catalog-category-icon {
            font-size: 1.3rem;
        }

        .catalog-brands {
            flex: 1;
            min-width: 200px;
        }

        .catalog-brands-title {
            font-size: 0.85rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .catalog-brands-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .catalog-brand-btn {
            background: transparent;
            color: var(--accent-color);
            padding: 8px 16px;
            border-radius: 25px;
            border: 1px solid var(--accent-color);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .catalog-brand-btn:hover {
            background: var(--accent-color);
            color: var(--white);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 998;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        /* ==================== СЕКЦИИ ==================== */
        section {
            padding: 60px 0;
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 3rem;
            color: var(--header-bg);
        }

        /* ==================== КАРТОЧКИ АКТИВОВ ==================== */
        .rates-section {
            background-color: var(--bg-color);
        }

        .assets-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-bottom: 2rem;
        }

        .asset-card {
            background: var(--card-bg);
            border: 1px solid var(--accent-color);
            border-radius: 20px;
            padding: 1.5rem;
            transition: box-shadow 0.3s, transform 0.3s;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .asset-card:hover {
            box-shadow: 0 4px 20px rgba(45, 106, 79, 0.15);
            transform: translateY(-2px);
        }

        .asset-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .asset-icon {
            font-size: 2rem;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            border-radius: 12px;
        }

        .asset-info {
            flex: 1;
        }

        .asset-name {
            font-size: 0.9rem;
            color: #666;
            font-weight: 500;
        }

        .asset-code {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--header-bg);
        }

        .asset-price {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-color);
            letter-spacing: -0.02em;
        }

        .asset-change {
            font-size: 0.95rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
        }

        .asset-change.positive {
            color: var(--green-up);
            background: rgba(45, 106, 79, 0.1);
        }

        .asset-change.negative {
            color: var(--red-down);
            background: rgba(211, 47, 47, 0.1);
        }

        .asset-change.neutral {
            color: #666;
            background: #f0f0f0;
        }

        .sparkline-container {
            width: 100%;
            height: 50px;
            margin-top: auto;
        }

        .sparkline-container svg {
            width: 100%;
            height: 100%;
        }

        .rates-update-time {
            font-size: 0.85rem;
            color: #666;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .rates-btn-container {
            text-align: center;
        }

        .btn-rates {
            background-color: var(--accent-color);
            color: var(--white);
            padding: 12px 30px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.3s;
            font-family: inherit;
        }

        .btn-rates:hover {
            opacity: 0.9;
        }

        .rates-error {
            text-align: center;
            color: #666;
            padding: 2rem;
            font-size: 1.1rem;
        }

        .rates-pending {
            text-align: center;
            color: var(--header-bg);
            padding: 2rem;
            font-size: 1.1rem;
        }

        /* ==================== ПОДВАЛ ==================== */
        footer {
            background-color: var(--header-bg);
            color: var(--white);
            text-align: center;
            padding: 2rem 0;
        }

        /* ==================== МОБИЛЬНАЯ ВЕРСИЯ ==================== */
        @media (max-width: 1024px) {
            .assets-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .mobile-menu-btn {
                display: block;
            }

            .header-btn {
                display: none;
            }

            nav ul {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background-color: var(--header-bg);
                flex-direction: column;
                padding: 1rem 0;
                gap: 0;
            }

            nav ul.active {
                display: flex;
            }

            nav ul li {
                text-align: center;
                padding: 0.75rem 0;
            }

            nav ul li a {
                display: block;
                padding: 0.5rem 1rem;
            }

            .section-title {
                font-size: 1.8rem;
            }

            .assets-grid {
                gap: 16px;
            }

            .asset-card {
                padding: 1.25rem;
            }

            .asset-icon {
                width: 40px;
                height: 40px;
                font-size: 1.5rem;
            }

            .asset-price {
                font-size: 1.4rem;
            }

            .asset-code {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Шапка -->
    <header>
        <div class="container header-content">
            <a href="index.html" class="logo"><img src="logo.png" alt="YuNur"></a>
            <button class="mobile-menu-btn" onclick="toggleMenu()">☰</button>
            <nav>
                <ul id="nav-menu">
                    <li><a href="index.html#calculator">Калькулятор</a></li>
                    <li><a href="index.html#how-it-works">Как это работает</a></li>
                    <li><a href="rates.html">Курсы валют</a></li>
                    <li><a href="articles.html">Статьи</a></li>
                </ul>
            </nav>
            <button class="catalog-btn" onclick="toggleCatalog()">
                <span class="catalog-btn-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
                Каталог
            </button>
            <a href="index.html#application" class="header-btn">Оставить заявку</a>
        </div>
    </header>

    <!-- Каталог Dropdown -->
    <div class="overlay" id="catalog-overlay" onclick="closeCatalog()"></div>
    <div class="catalog-dropdown" id="catalog-dropdown">
        <div class="catalog-dropdown-content">
            <div class="catalog-categories">
                <div class="catalog-category active" data-category="phones" onclick="selectCategory('phones')">
                    <span class="catalog-category-icon">📱</span>
                    <span>Телефоны</span>
                </div>
                <div class="catalog-category" data-category="fridge" onclick="selectCategory('fridge')">
                    <span class="catalog-category-icon">🧊</span>
                    <span>Холодильники</span>
                </div>
                <div class="catalog-category" data-category="washing" onclick="selectCategory('washing')">
                    <span class="catalog-category-icon">🌀</span>
                    <span>Стиральные машины</span>
                </div>
                <div class="catalog-category" data-category="vacuum" onclick="selectCategory('vacuum')">
                    <span class="catalog-category-icon">🧹</span>
                    <span>Пылесосы</span>
                </div>
            </div>
            <div class="catalog-brands">
                <p class="catalog-brands-title">Бренды</p>
                <div class="catalog-brands-list" id="brands-container">
                    <!-- Бренды заполняются JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Курсы валют и золото -->
    <section class="rates-section">
        <div class="container">
            <h2 class="section-title">Рынки</h2>
            <div id="assets-container" class="assets-grid">
                <!-- Карточки будут добавлены через JS -->
            </div>
            <div id="rates-update-time" class="rates-update-time"></div>
            <div id="rates-pending" class="rates-pending" style="display: none;">Загрузка данных...</div>
            <div id="rates-error" class="rates-error" style="display: none;"></div>
            <div class="rates-btn-container">
                <button class="btn-rates" onclick="loadAllData()">Обновить курсы</button>
            </div>
        </div>
    </section>

    <!-- Подвал -->
    <footer>
        <div class="container">
            <p>&copy; YuNur. Исламская рассрочка без переплат.</p>
        </div>
    </footer>

    <script>
        // Каталог
        const brandsByCategory = {
            phones: ['iPhone', 'Samsung'],
            fridge: ['Samsung', 'LG', 'Bosch', 'Haier', 'Indesit'],
            washing: ['LG', 'Samsung', 'Bosch', 'Haier', 'Indesit'],
            vacuum: ['Dyson', 'Samsung', 'LG', 'Bosch', 'Philips']
        };

        let currentCategory = 'phones';

        function toggleCatalog() {
            const dropdown = document.getElementById('catalog-dropdown');
            const overlay = document.getElementById('catalog-overlay');
            dropdown.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        function closeCatalog() {
            const dropdown = document.getElementById('catalog-dropdown');
            const overlay = document.getElementById('catalog-overlay');
            dropdown.classList.remove('active');
            overlay.classList.remove('active');
        }

        function selectCategory(category) {
            currentCategory = category;
            
            // Обновляем активную категорию
            document.querySelectorAll('.catalog-category').forEach(cat => {
                cat.classList.remove('active');
                if (cat.dataset.category === category) {
                    cat.classList.add('active');
                }
            });
            
            // Заполняем бренды
            const brandsContainer = document.getElementById('brands-container');
            brandsContainer.innerHTML = '';
            brandsByCategory[category].forEach(brand => {
                const btn = document.createElement('a');
                btn.className = 'catalog-brand-btn';
                btn.textContent = brand;
                btn.href = `brand.html?b=${brand.toLowerCase()}`;
                brandsContainer.appendChild(btn);
            });
        }

        // Инициализация брендов при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            selectCategory('phones');
        });

        // Мобильное меню
        function toggleMenu() {
            const menu = document.getElementById('nav-menu');
            menu.classList.toggle('active');
        }

        // Иконки для активов
        const assetIcons = {
            'USD': '🇺🇸',
            'EUR': '🇪🇺',
            'CNY': '🇨🇳',
            'JPY': '🇯🇵',
            'GOLD': '🥇',
            'BTC': '₿',
            'ETH': 'Ξ'
        };

        // Создание SVG спарклайна
        function createSparkline(data, isUp) {
            if (!data || data.length === 0) {
                return '';
            }

            const width = 200;
            const height = 50;
            const padding = 4;
            const color = isUp ? '#2d6a4f' : '#d32f2f';
            
            // Находим мин и макс для масштабирования
            const min = Math.min(...data);
            const max = Math.max(...data);
            const range = max - min || 1; // Избегаем деления на ноль

            // Генерируем точки пути
            const points = data.map((value, index) => {
                const x = padding + (index / (data.length - 1)) * (width - 2 * padding);
                const y = padding + (1 - (value - min) / range) * (height - 2 * padding);
                return `${x},${y}`;
            }).join(' ');

            // Создаём путь для заливки (добавляем точки вниз для замыкания)
            const firstX = padding;
            const lastX = width - padding;
            const bottomY = height - padding;
            const fillPoints = `${firstX},${bottomY} ${points} ${lastX},${bottomY}`;

            return `
                <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
                    <defs>
                        <linearGradient id="gradient-${isUp ? 'up' : 'down'}" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:${color};stop-opacity:0.3" />
                            <stop offset="100%" style="stop-color:${color};stop-opacity:0.05" />
                        </linearGradient>
                    </defs>
                    <polygon points="${fillPoints}" fill="url(#gradient-${isUp ? 'up' : 'down'})" />
                    <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            `;
        }

        // Создание плоского спарклайна (если нет истории)
        function createFlatSparkline() {
            const width = 200;
            const height = 50;
            const padding = 4;
            const y = height / 2;
            const color = '#2d6a4f';

            return `
                <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
                    <line x1="${padding}" y1="${y}" x2="${width - padding}" y2="${y}" 
                          stroke="${color}" stroke-width="2" stroke-linecap="round" />
                </svg>
            `;
        }

        // Рендеринг карточки актива
        function renderAssetCard(asset, historyData) {
            const icon = assetIcons[asset.code] || '💱';
            const isCrypto = ['BTC', 'ETH'].includes(asset.code);
            
            // Проверяем доступность данных
            if (asset.unavailable) {
                return `
                    <div class="asset-card">
                        <div class="asset-header">
                            <div class="asset-icon">${icon}</div>
                            <div class="asset-info">
                                <div class="asset-name">${asset.name}</div>
                                <div class="asset-code">${asset.code}</div>
                            </div>
                        </div>
                        <div class="asset-price">недоступно</div>
                        <div class="sparkline-container">${createFlatSparkline()}</div>
                    </div>
                `;
            }

            // Расчёт изменения в процентах
            let changeHtml = '<span class="asset-change neutral">—</span>';
            if (asset.changePercent !== null && asset.changePercent !== undefined) {
                const isPositive = asset.changePercent >= 0;
                const sign = isPositive ? '+' : '';
                const changeClass = isPositive ? 'positive' : 'negative';
                changeHtml = `<span class="asset-change ${changeClass}">${sign}${asset.changePercent.toFixed(2)}%</span>`;
            }

            // Форматирование цены
            let priceFormatted;
            if (asset.code === 'JPY') {
                priceFormatted = asset.value.toFixed(4);
            } else if (isCrypto) {
                priceFormatted = asset.value.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            } else {
                priceFormatted = asset.value.toFixed(2);
            }

            // Получаем историю для спарклайна
            let sparklineHtml;
            const history = historyData ? historyData[asset.code.toLowerCase()] : null;
            
            if (history && history.length > 1) {
                const isUp = history[history.length - 1] >= history[0];
                sparklineHtml = createSparkline(history, isUp);
            } else {
                sparklineHtml = createFlatSparkline();
            }

            return `
                <div class="asset-card">
                    <div class="asset-header">
                        <div class="asset-icon">${icon}</div>
                        <div class="asset-info">
                            <div class="asset-name">${asset.name}</div>
                            <div class="asset-code">${asset.code}</div>
                        </div>
                    </div>
                    <div class="asset-price">${priceFormatted} ₽</div>
                    ${changeHtml}
                    <div class="sparkline-container">${sparklineHtml}</div>
                </div>
            `;
        }

        // Загрузка истории из локального файла
        async function loadHistory() {
            try {
                const response = await fetch('data/history.json?t=' + Date.now());
                if (!response.ok) return null;
                const data = await response.json();
                
                if (!Array.isArray(data) || data.length === 0) return null;

                // Преобразуем в формат по кодам активов
                const historyByCode = {
                    usd: [],
                    eur: [],
                    cny: [],
                    jpy: [],
                    gold: []
                };

                // Берём последние 30 записей
                const recentData = data.slice(-30);
                
                recentData.forEach(record => {
                    if (record.usd) historyByCode.usd.push(record.usd);
                    if (record.eur) historyByCode.eur.push(record.eur);
                    if (record.cny) historyByCode.cny.push(record.cny);
                    if (record.jpy) historyByCode.jpy.push(record.jpy);
                    if (record.gold) historyByCode.gold.push(record.gold);
                });

                return historyByCode;
            } catch (error) {
                console.log('История не загружена:', error.message);
                return null;
            }
        }

        // Загрузка криптовалют с CoinGecko
        async function loadCrypto() {
            try {
                const response = await fetch(
                    'https://api.coingecko.com/api/v3/coins/markets?vs_currency=rub&ids=bitcoin,ethereum&sparkline=true',
                    { timeout: 10000 }
                );
                
                if (!response.ok) throw new Error('API unavailable');
                
                const data = await response.json();
                
                const crypto = {};
                data.forEach(coin => {
                    const code = coin.symbol.toUpperCase();
                    crypto[code] = {
                        value: coin.current_price,
                        changePercent: coin.price_change_percentage_24h,
                        history: coin.sparkline_in_7d?.price || []
                    };
                });
                
                return crypto;
            } catch (error) {
                console.log('Криптоданные недоступны:', error.message);
                return {
                    BTC: { unavailable: true },
                    ETH: { unavailable: true }
                };
            }
        }

        // Основная функция загрузки всех данных
        async function loadAllData() {
            const container = document.getElementById('assets-container');
            const updateTimeEl = document.getElementById('rates-update-time');
            const errorEl = document.getElementById('rates-error');
            const pendingEl = document.getElementById('rates-pending');

            try {
                pendingEl.style.display = 'block';
                errorEl.style.display = 'none';
                container.innerHTML = '';

                // Загружаем данные параллельно
                const [ratesResponse, historyData, cryptoData] = await Promise.all([
                    fetch('data/rates.json?t=' + Date.now()),
                    loadHistory(),
                    loadCrypto()
                ]);

                if (!ratesResponse.ok) {
                    throw new Error('Файл курсов не найден');
                }

                const ratesData = await ratesResponse.json();

                if (!ratesData.currencies || ratesData.currencies.length === 0) {
                    throw new Error('Нет данных о курсах');
                }

                // Собираем все активы
                const assets = [];

                // Валюты и золото из rates.json
                ratesData.currencies.forEach(curr => {
                    let changePercent = null;
                    if (curr.previous !== null && curr.previous > 0) {
                        changePercent = ((curr.value - curr.previous) / curr.previous) * 100;
                    }

                    assets.push({
                        code: curr.code,
                        name: curr.name,
                        value: curr.value,
                        changePercent: changePercent
                    });
                });

                // Криптовалюты
                if (cryptoData.BTC) {
                    assets.push({
                        code: 'BTC',
                        name: 'Bitcoin',
                        value: cryptoData.BTC.value,
                        changePercent: cryptoData.BTC.changePercent,
                        history: cryptoData.BTC.history,
                        unavailable: cryptoData.BTC.unavailable
                    });
                }
                if (cryptoData.ETH) {
                    assets.push({
                        code: 'ETH',
                        name: 'Ethereum',
                        value: cryptoData.ETH.value,
                        changePercent: cryptoData.ETH.changePercent,
                        history: cryptoData.ETH.history,
                        unavailable: cryptoData.ETH.unavailable
                    });
                }

                // Рендерим карточки
                let html = '';
                assets.forEach(asset => {
                    // Для крипты используем её собственную историю
                    const assetHistoryData = asset.history 
                        ? { [asset.code.toLowerCase()]: asset.history } 
                        : historyData;
                    html += renderAssetCard(asset, assetHistoryData);
                });

                container.innerHTML = html;

                // Форматируем дату обновления
                if (ratesData.updatedAt) {
                    const updateDate = new Date(ratesData.updatedAt);
                    const formattedDate = updateDate.toLocaleString('ru-RU', {
                        day: 'numeric',
                        month: 'long',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    updateTimeEl.textContent = `Обновлено: ${formattedDate}`;
                }

                errorEl.style.display = 'none';
                pendingEl.style.display = 'none';

            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                container.innerHTML = '';
                updateTimeEl.textContent = '';
                errorEl.textContent = 'Ошибка загрузки данных';
                errorEl.style.display = 'block';
                pendingEl.style.display = 'none';
            }
        }

        // Загружаем данные при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            loadAllData();
        });
    </script>
</body>
</html>
