<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YuNur</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }
    .form-container {
      margin-top: 30px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .form-group textarea {
      height: 100px;
      resize: vertical;
    }
    .submit-btn {
      background-color: #4CAF50;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    .submit-btn:hover {
      background-color: #45a049;
    }
    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      display: none;
    }
    .message.info {
      background-color: #d7e3ff;
      color: #1a3d6e;
      border: 1px solid #b8cff5;
    }
    .form-note {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Привет! Это сайт YuNur</h1>
  <p>Мой новый сайт на GitHub Pages.</p>
  
  <div class="form-container">
    <h2>Форма заявки</h2>
    <form id="contactForm">
      <div class="form-group">
        <label for="name">Имя:</label>
        <input type="text" id="name" name="name" required placeholder="Введите ваше имя">
      </div>
      
      <div class="form-group">
        <label for="contact">Контакт (телефон/мессенджер):</label>
        <input type="text" id="contact" name="contact" required placeholder="Введите ваш телефон или ник в мессенджере">
      </div>
      
      <div class="form-group">
        <label for="message">Сообщение:</label>
        <textarea id="message" name="message" required placeholder="Введите ваше сообщение"></textarea>
      </div>
      
      <button type="submit" class="submit-btn">Отправить</button>
      
      <div id="formMessage" class="message info">
        Функция временно недоступна, мы тестируем сайт
      </div>
      
      <p class="form-note">Мы свяжемся с вами через WhatsApp</p>
    </form>
  </div>

  <script>
    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Показываем сообщение о временной недоступности
      var messageDiv = document.getElementById('formMessage');
      messageDiv.style.display = 'block';
      
      // Скрываем сообщение через 5 секунд
      setTimeout(function() {
        messageDiv.style.display = 'none';
      }, 5000);
    });
  </script>
</body>
</html>
