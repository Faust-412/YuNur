name: Build Articles and Generate Weekly Review

on:
  push:
    paths:
      - 'content/**/*.md'
      - 'scripts/build-articles.js'
  schedule:
    # Запуск каждый понедельник в 00:00 UTC для генерации статьи "Неделя рынков"
    - cron: '0 0 * * 1'
  workflow_dispatch: # Ручной запуск через GitHub UI

permissions:
  contents: write

jobs:
  build-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install axios xml2js

      - name: Generate weekly review (Monday only)
        run: node scripts/generate-weekly-review.js
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

      - name: Build articles
        run: node scripts/build-articles.js

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add content/articles.json articles/*.html content/*.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Build articles [auto]"
            git push
          fi
