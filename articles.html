<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Статьи — YuNur</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:#eef2ef;color:#22372e}
header{background:#2b4a3a;padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.logo{background:#f4f1ea;color:#2b4a3a;font-weight:700;padding:8px 14px;border-radius:12px;text-decoration:none}
nav{display:flex;gap:16px;flex-wrap:wrap;margin-left:auto}
nav a{color:#fff;text-decoration:none;font-size:15px}
.btn{background:#fff;color:#2b4a3a;padding:10px 18px;border-radius:999px;text-decoration:none;font-weight:600}

/* Каталог кнопка */
.catalog-btn{background:transparent;color:#fff;padding:8px 16px;border-radius:8px;font-weight:500;font-size:15px;transition:all 0.2s ease;border:1px solid rgba(255,255,255,0.2);cursor:pointer;display:flex;align-items:center;gap:8px}
.catalog-btn:hover{background:rgba(255,255,255,0.1)}
.catalog-btn-icon{display:flex;flex-direction:column;gap:3px}
.catalog-btn-icon span{display:block;width:18px;height:2px;background:#fff;border-radius:1px}

/* Каталог Dropdown */
.catalog-dropdown{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-10px);background:#fff;border:1px solid #2d6a4f;border-radius:20px;box-shadow:0 10px 40px rgba(27,67,50,0.2);z-index:999;display:none;overflow:hidden;max-width:900px;width:calc(100vw - 40px)}
.catalog-dropdown.active{display:block;animation:dropdownFade 0.2s ease forwards}
@keyframes dropdownFade{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.catalog-dropdown-content{display:flex;padding:1.5rem;gap:1.5rem}
.catalog-categories{min-width:220px;border-right:1px solid rgba(27,67,50,0.1);padding-right:1.5rem}
.catalog-category{display:flex;align-items:center;gap:0.75rem;padding:12px 16px;border-radius:12px;cursor:pointer;transition:all 0.2s ease;font-weight:500;color:#22372e;margin-bottom:0.5rem}
.catalog-category:hover{background:#f2f7f4}
.catalog-category.active{background:#2d6a4f;color:#fff}
.catalog-category-icon{font-size:1.3rem}
.catalog-brands{flex:1;min-width:200px}
.catalog-brands-title{font-size:0.85rem;color:#2d6a4f;text-transform:uppercase;letter-spacing:0.08em;font-weight:600;margin-bottom:1rem}
.catalog-brands-list{display:flex;flex-wrap:wrap;gap:0.5rem}
.catalog-brand-btn{background:transparent;color:#2d6a4f;padding:8px 16px;border-radius:25px;border:1px solid #2d6a4f;font-size:0.9rem;font-weight:500;cursor:pointer;transition:all 0.2s ease;text-decoration:none;display:inline-block}
.catalog-brand-btn:hover{background:#2d6a4f;color:#fff}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.3);z-index:998;display:none}
.overlay.active{display:block}
main{max-width:1000px;margin:0 auto;padding:34px 18px 70px}
h1{text-align:center;color:#1f3a2d;margin-bottom:26px;font-size:34px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:#fbfcfb;border:1px solid #2b4a3a33;border-radius:16px;padding:20px;cursor:pointer}
.card:hover{box-shadow:0 6px 18px #2b4a3a22}
.cat{display:inline-block;font-size:12px;color:#3e6b4f;border:1px solid #3e6b4f55;border-radius:999px;padding:3px 10px;margin-bottom:10px}
.card h3{color:#1f3a2d;margin-bottom:8px}
.card p{font-size:14px;color:#51655a}
.date{margin-top:12px;font-size:12px;color:#7d8f85}
.msg{text-align:center;color:#7d8f85;padding:30px}
.err{text-align:center;color:#b3372f;padding:30px}
article{background:#fbfcfb;border:1px solid #2b4a3a33;border-radius:16px;padding:28px}
article h2{color:#1f3a2d;margin:22px 0 10px}
article p{margin:10px 0;line-height:1.6}
.back{display:inline-block;margin-bottom:16px;color:#3e6b4f;cursor:pointer;text-decoration:underline}
footer{background:#2b4a3a;color:#dfe9e2;text-align:center;padding:22px;font-size:14px}
</style>
</head>
<body>
<header>
<a class="logo" href="index.html">YuNur</a>
<nav>
<a href="index.html#calculator">Калькулятор</a>
<a href="index.html#how-it-works">Как это работает</a>
<a href="rates.html">Курсы валют</a>
<a href="articles.html">Статьи</a>
</nav>
<button class="catalog-btn" onclick="toggleCatalog()">
    <span class="catalog-btn-icon">
        <span></span>
        <span></span>
        <span></span>
    </span>
    Каталог
</button>
<a class="btn" href="index.html#application">Оставить заявку</a>
</header>
<main>
<h1>Статьи</h1>
<div id="content"><div class="msg">Загрузка...</div></div>
</main>
<footer>© YuNur. Исламская рассрочка без переплат.</footer>

<!-- Каталог Dropdown -->
<div class="overlay" id="catalog-overlay" onclick="closeCatalog()"></div>
<div class="catalog-dropdown" id="catalog-dropdown">
    <div class="catalog-dropdown-content">
        <div class="catalog-categories">
            <div class="catalog-category active" data-category="phones" onclick="selectCategory('phones')">
                <span class="catalog-category-icon">📱</span>
                <span>Телефоны</span>
            </div>
            <div class="catalog-category" data-category="fridge" onclick="selectCategory('fridge')">
                <span class="catalog-category-icon">🧊</span>
                <span>Холодильники</span>
            </div>
            <div class="catalog-category" data-category="washing" onclick="selectCategory('washing')">
                <span class="catalog-category-icon">🌀</span>
                <span>Стиральные машины</span>
            </div>
            <div class="catalog-category" data-category="vacuum" onclick="selectCategory('vacuum')">
                <span class="catalog-category-icon">🧹</span>
                <span>Пылесосы</span>
            </div>
        </div>
        <div class="catalog-brands">
            <p class="catalog-brands-title">Бренды</p>
            <div class="catalog-brands-list" id="brands-container">
                <!-- Бренды заполняются JS -->
            </div>
        </div>
    </div>
</div>
<script>
const API='https://api.github.com/repos/Faust-412/YuNur/contents/content/articles?ref=main';
let articles=[];
async function loadList(){
const box=document.getElementById('content');
try{
const res=await fetch(API);
if(res.status===404){box.innerHTML='<div class="msg">Статей пока нет — скоро появятся.</div>';return;}
if(!res.ok)throw 0;
const files=(await res.json()).filter(f=>f.name.endsWith('.md')||f.name.endsWith('.txt'));
if(!files.length){box.innerHTML='<div class="msg">Статей пока нет — скоро появятся.</div>';return;}
articles=await Promise.all(files.map(async f=>{const raw=await(await fetch(f.download_url)).text();return parse(raw,f.name);}));
articles.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
renderList();
}catch(e){box.innerHTML='<div class="err">Не удалось загрузить статьи. Попробуйте позже.</div>';}
}
function parse(raw,file){
const lines=raw.split('\n');
const a={file,title:file,category:'Статьи',date:'',teaser:'',body:[]};
let i=0;
for(;i<lines.length;i++){
const l=lines[i].trim();
if(l.startsWith('Название:'))a.title=l.replace('Название:','').trim();
else if(l.startsWith('Рубрика:'))a.category=l.replace('Рубрика:','').trim();
else if(l.startsWith('Дата:'))a.date=l.replace('Дата:','').trim();
else if(l.startsWith('Тизер:'))a.teaser=l.replace('Тизер:','').trim();
else break;
}
a.body=lines.slice(i);
if(!a.teaser)a.teaser=(a.body.find(l=>l.trim()&&!l.startsWith('#'))||'').trim();
return a;
}
function renderList(){
const box=document.getElementById('content');
box.innerHTML='<div class="grid">'+articles.map((a,n)=>'<div class="card" onclick="openArticle('+n+')"><span class="cat">'+esc(a.category)+'</span><h3>'+esc(a.title)+'</h3><p>'+esc(a.teaser)+'</p><div class="date">'+esc(fmtDate(a.date))+'</div></div>').join('')+'</div>';
}
function openArticle(n){
const a=articles[n];
const html=a.body.map(line=>{
const l=line.trim();
if(!l)return '';
if(l.startsWith('### '))return '<h2>'+esc(l.slice(4))+'</h2>';
if(l.startsWith('## '))return '<h2>'+esc(l.slice(3))+'</h2>';
if(l.startsWith('# '))return '<h2>'+esc(l.slice(2))+'</h2>';
if(l.startsWith('- '))return '<p>• '+esc(l.slice(2))+'</p>';
return '<p>'+esc(l)+'</p>';
}).join('');
document.getElementById('content').innerHTML='<span class="back" onclick="renderList()">← Все статьи</span><article><span class="cat">'+esc(a.category)+'</span><h1 style="text-align:left;font-size:28px;margin:8px 0 4px">'+esc(a.title)+'</h1><div class="date">'+esc(fmtDate(a.date))+'</div>'+html+'</article>';
window.scrollTo(0,0);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtDate(d){if(!d)return '';const t=new Date(d);return isNaN(t)?d:t.toLocaleDateString('ru-RU');}

// Каталог
const brandsByCategory={phones:['iPhone','Samsung'],fridge:['Samsung','LG','Bosch','Haier','Indesit'],washing:['LG','Samsung','Bosch','Haier','Indesit'],vacuum:['Dyson','Samsung','LG','Bosch','Philips']};
let currentCategory='phones';
function toggleCatalog(){const dropdown=document.getElementById('catalog-dropdown');const overlay=document.getElementById('catalog-overlay');dropdown.classList.toggle('active');overlay.classList.toggle('active');}
function closeCatalog(){const dropdown=document.getElementById('catalog-dropdown');const overlay=document.getElementById('catalog-overlay');dropdown.classList.remove('active');overlay.classList.remove('active');}
function selectCategory(category){currentCategory=category;document.querySelectorAll('.catalog-category').forEach(cat=>{cat.classList.remove('active');if(cat.dataset.category===category){cat.classList.add('active');}});const brandsContainer=document.getElementById('brands-container');brandsContainer.innerHTML='';brandsByCategory[category].forEach(brand=>{const btn=document.createElement('a');btn.className='catalog-brand-btn';btn.textContent=brand;btn.href='brand.html?b='+brand.toLowerCase();brandsContainer.appendChild(btn);});}
document.addEventListener('DOMContentLoaded',function(){selectCategory('phones');});

loadList();
</script>
</body>
</html>
